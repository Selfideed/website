# SelfIDeed website: example Nginx server block.
# Copy into /etc/nginx/sites-available/, adjust the paths and certificates, then `nginx -t && systemctl reload nginx`.

# Language for the root address: the visitor's own choice (cookie) wins, otherwise the browser's first language.
map $http_accept_language $sid_lang_browser {
    default  en;
    ~*^nl    nl;
}
map $cookie_sid_lang $sid_lang {
    en       en;
    nl       nl;
    default  $sid_lang_browser;
}

server {
    listen 80;
    listen [::]:80;
    server_name selfideed.com www.selfideed.com;
    return 301 https://selfideed.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.selfideed.com;
    # ssl_certificate     /etc/letsencrypt/live/selfideed.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/selfideed.com/privkey.pem;
    return 301 https://selfideed.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name selfideed.com;

    # ssl_certificate     /etc/letsencrypt/live/selfideed.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/selfideed.com/privkey.pem;

    root /var/www/selfideed/website;   # the checked-out GitHub repo
    index index.html;
    charset utf-8;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Compression
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json application/manifest+json;

    # Never serve repo internals
    location ~ /\.(?!well-known) { deny all; }
    location ~ ^/(nginx/|CLAUDE\.md|README\.md) { return 404; }

    # Root: send visitors to their language
    location = / {
        add_header Vary "Accept-Language, Cookie" always;
        add_header Cache-Control "no-store" always;
        return 302 /$sid_lang/;
    }

    # Clean URLs: /en/about/ -> /en/about/index.html
    location / {
        try_files $uri $uri/ =404;
    }

    # Fonts, images and favicons rarely change
    location ~* \.(woff2|svg|png|jpg|jpeg|webp|avif|ico|mp4)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }
    # CSS and JS: short cache until we add file versioning
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Not found: Dutch page for /nl/ addresses, English for everything else
    error_page 404 /en/404.html;
    location /nl/ {
        try_files $uri $uri/ =404;
        error_page 404 /nl/404.html;
    }
}
